[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlab"
version = "0.1.0"
description = "Local-first market regime and large-cap opportunity research system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "typer>=0.12",
]

[project.scripts]
marketlab = "marketlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
